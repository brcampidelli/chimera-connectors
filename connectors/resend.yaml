    só for enviar.
license: null
capability:
  read: true
  write: true
  executes: false
  money: false
default_mode: scoped
default_mode_notes: Operações desligadas até o dono escolher; o limite real é a permissão da chave (full access
  × sending access por domínio).
categories:
  primary: email-messaging
  secondary:
  - marketing
  - apis-integrations
tags:
- email
- passapro
logo:
  source: monogram
  url_if_allowed: null
  decision: 'Monograma neutro: kit de marca do fornecedor não conferido nesta leva; nenhum arquivo de logo de terceiro
    no repositório.'
stars: null
notes: Especificação fixada por commit. A Resend também mantém um servidor MCP próprio (resend/resend-mcp, MIT)
  — não avaliado nesta leva.
