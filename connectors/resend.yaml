# Conector do catálogo Chimera — só NOMES de variáveis, nunca valores.
id: resend
name: Resend
vendor: Resend
kind: openapi
official: true
evidence:
  url: https://resend.com/docs/api-reference/introduction
  checked_at: '2026-10-17'
  method: vendor-docs
  vendor_domains:
  - resend.com
  vendor_github_orgs:
  - resend
  extra_urls:
  - https://github.com/resend/resend-openapi
homepage: https://resend.com
docs: https://resend.com/docs/api-reference/introduction
status: ga
transport: http
openapi:
  connector_name: resend
  spec_url: https://raw.githubusercontent.com/resend/resend-openapi/69ea63623463bdb1ea15fa7667bc958065de4a69/resend.yaml
  spec_license: MIT
  base_url: https://api.resend.com
  key_in: header
  key_name: Authorization
  key_prefix: 'Bearer '
auth:
  method: api_key
  dcr_supported: false
  client_restriction: none
  env:
  - CHIMERA_CONNECTOR_RESEND_API_KEY
