  checked_at: '2026-10-17'
  method: vendor-docs
  vendor_domains:
  - supabase.com
  vendor_github_orgs:
  - supabase
  oauth_probe: 401 com resource_metadata; AS api.supabase.com anuncia registration_endpoint (DCR).
homepage: https://supabase.com
docs: https://supabase.com/docs/guides/getting-started/mcp
status: unknown
transport: http
http:
  url: https://mcp.supabase.com/mcp?read_only=true&features=database,docs
auth:
  method: oauth
  alt_methods:
  - api_key
  dcr_supported: true
  client_restriction: none
