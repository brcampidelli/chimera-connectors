  checked_at: '2026-10-17'
  method: vendor-repo
  vendor_domains:
  - sentry.io
  - sentry.dev
  vendor_github_orgs:
  - getsentry
  oauth_probe: 401 com resource_metadata; AS mcp.sentry.dev anuncia registration_endpoint (DCR) e client ID metadata
    document.
homepage: https://sentry.io
docs: https://github.com/getsentry/sentry-mcp
status: unknown
transport: http
http:
  url: https://mcp.sentry.dev/mcp?skills=inspect
  alternate_urls:
  - url: https://mcp.sentry.dev/mcp
    why: todas as skills ativas, incluindo triage, project-management e seer (escrita e IA da Sentry)
auth:
  method: oauth
  alt_methods:
  - api_key
  dcr_supported: true
  client_restriction: none
  env:
  - SENTRY_ACCESS_TOKEN
