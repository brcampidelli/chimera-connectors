# Valida os conectores e confere que dist/catalog.json está em dia.
# Sem segredos, sem pull_request_target, ações fixadas por SHA completo.
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Instalar dependências fixadas por hash
        run: python -m pip install --require-hashes --no-deps -r requirements.txt
      - name: Checar conectores
        run: python scripts/check.py
      - name: Conferir que dist/catalog.json está em dia
        run: python scripts/build_catalog.py --check
